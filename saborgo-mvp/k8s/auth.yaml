apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: saborgo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: saborgo-auth:v1
        imagePullPolicy: Never
        env:
        - name: DATABASE_URL
          value: "postgresql://saborgo_user:saborgo_password@db:5432/saborgo_db"
        ports:
        - containerPort: 3004
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: saborgo
spec:
  selector:
    app: auth
  ports:
  - port: 3004
    targetPort: 3004