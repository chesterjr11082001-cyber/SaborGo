apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos
  namespace: saborgo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pedidos
  template:
    metadata:
      labels:
        app: pedidos
    spec:
      containers:
      - name: pedidos
        image: saborgo-pedidos:v1
        imagePullPolicy: Never
        env:
        - name: DATABASE_URL
          value: "postgresql://saborgo_user:saborgo_password@db:5432/saborgo_db"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        ports:
        - containerPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: pedidos-service
  namespace: saborgo
spec:
  selector:
    app: pedidos
  ports:
  - port: 3002
    targetPort: 3002